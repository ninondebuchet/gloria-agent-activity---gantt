<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLORIA Agent Engagement – May 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#222;font-size:13px}

.topbar{background:#1e2235;color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.topbar-left .sub{font-size:11px;opacity:.45;margin-top:3px}

.copy-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 16px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s}
.copy-btn:hover{background:rgba(255,255,255,.22)}
.copy-btn.copied{background:#27ae60;border-color:#27ae60}

.toolbar{background:#fff;border-bottom:1px solid #e2e5ec;padding:10px 28px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tool-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#aaa;margin-right:2px}
.mode-btn{padding:5px 13px;border-radius:5px;border:1.5px solid #ddd;font-size:12px;cursor:pointer;background:#fff;transition:all .15s;font-weight:500;display:flex;align-items:center;gap:5px}
.mode-btn:hover{opacity:.8}
.mode-btn.active{filter:brightness(.88);outline:2px solid rgba(0,0,0,.2)}
.sep{width:1px;height:24px;background:#eee;margin:0 8px}

.legend{display:flex;gap:16px;align-items:center;margin-left:auto;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#666}
.leg-box{width:13px;height:13px;border-radius:3px;flex-shrink:0}
.leg-dot{width:13px;height:13px;border-radius:3px;background:#222;display:flex;align-items:center;justify-content:center}
.leg-dot::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff}

.wrap{padding:20px 28px;overflow-x:auto}
.gantt{background:#fff;border-radius:8px;box-shadow:0 1px 10px rgba(0,0,0,.09);overflow:hidden;min-width:860px}

.hdr-month{display:flex;background:#1e2235;color:#fff}
.hdr-agent-cell{width:176px;min-width:176px;padding:8px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.35);border-right:1px solid rgba(255,255,255,.08);flex-shrink:0}
.hdr-month-label{flex:1;padding:8px 0;text-align:center;font-size:12px;font-weight:600;letter-spacing:.4px}

.hdr-days{display:flex;background:#252a40;border-bottom:2px solid #1a1e30}
.hdr-day{flex:1;text-align:center;padding:5px 1px;border-right:1px solid rgba(255,255,255,.05)}
.hdr-day .dn{font-size:8.5px;color:rgba(255,255,255,.3);text-transform:uppercase}
.hdr-day .dd{font-size:11px;color:rgba(255,255,255,.65);font-weight:600;margin-top:1px}
.hdr-day.wknd .dd,.hdr-day.wknd .dn{color:rgba(255,255,255,.22)}
.hdr-day.tod .dd{color:#4ecdc4;font-weight:800}

.agent-row{display:flex;border-bottom:1px solid #f0f2f5;transition:background .1s}
.agent-row:hover{background:#fafbfe}
.agent-row:last-child{border-bottom:none}
.agent-row.alt{background:#fcfcfd}

.agent-name{width:176px;min-width:176px;padding:0 12px;border-right:1px solid #eee;display:flex;align-items:center;gap:8px;flex-shrink:0;height:38px}
.agent-num{width:20px;height:20px;border-radius:50%;background:#1e2235;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.name-text{font-size:12px;font-weight:500;color:#333;cursor:pointer;border-bottom:1px dashed transparent;transition:border .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.name-text:hover{border-bottom-color:#aaa}

.cells{flex:1;display:flex}
.cell{flex:1;height:38px;border-right:1px solid #f0f2f5;cursor:pointer;transition:opacity .1s,transform .1s;position:relative;display:flex;align-items:center;justify-content:center}
.cell:hover{opacity:.78;transform:scaleY(.88)}
.cell.blank{background:#fff}
.cell.wknd{background:#f7f8fa}
.cell.sustenance{background:#27ae60}
.cell.targeted{background:#e67e22}
.cell.direct{background:#e74c3c}
.cell.tod-col{border-left:2px solid #4ecdc4;border-right:2px solid #4ecdc4}
.mil-dot{width:9px;height:9px;border-radius:50%;background:#111;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.55)}

.statsbar{display:flex;background:#fff;border-top:2px solid #f0f2f5}
.stat{flex:1;padding:12px 0;text-align:center;border-right:1px solid #f0f2f5}
.stat:last-child{border-right:none}
.stat-n{font-size:19px;font-weight:700;color:#1e2235}
.stat-n.g{color:#27ae60}.stat-n.o{color:#e67e22}.stat-n.r{color:#e74c3c}
.stat-l{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.stat-l.editable{cursor:pointer;border-bottom:1px dashed transparent;transition:border .15s;display:inline-block}
.stat-l.editable:hover{border-bottom-color:#bbb}
.stat-input{font-size:10px;color:#555;border:1px solid #4ecdc4;border-radius:3px;padding:1px 4px;width:80px;text-align:center;outline:none;text-transform:uppercase;letter-spacing:.5px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:24px;width:340px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal h2{font-size:14px;font-weight:700;margin-bottom:16px;color:#1e2235}
.modal label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;margin-top:12px}
.modal input{width:100%;border:1.5px solid #ddd;border-radius:5px;padding:7px 10px;font-size:13px;outline:none;transition:border .15s}
.modal input:focus{border-color:#4ecdc4}
.modal-btns{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.modal-btns button{padding:7px 18px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.btn-save{background:#1e2235;color:#fff}
.btn-cancel{background:#f0f2f5;color:#555}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div style="font-size:15px;font-weight:600;color:#fff">🎯 GLORIA — Agent Engagement Tracker</div>
    <div class="sub">May 2026 &nbsp;·&nbsp; Fill in cells, then click "Copy link" to save &amp; share</div>
  </div>
  <button class="copy-btn" id="copy-btn" onclick="copyLink()">
    🔗 Copy shareable link
  </button>
</div>

<div class="toolbar">
  <span class="tool-label">Mode:</span>
  <button class="mode-btn active" id="btn-sus" onclick="setMode('sus')" style="background:#27ae60;color:#fff;border-color:#27ae60">
    <span>●</span><span id="lbl-sus">Sustenance</span>
  </button>
  <button class="mode-btn" id="btn-tar" onclick="setMode('tar')" style="border-color:#e67e22;color:#e67e22">
    <span>●</span><span id="lbl-tar">Targeted</span>
  </button>
  <button class="mode-btn" id="btn-dir" onclick="setMode('dir')" style="border-color:#e74c3c;color:#e74c3c">
    <span>●</span><span id="lbl-dir">Direct</span>
  </button>
  <div class="sep"></div>
  <button class="mode-btn" id="btn-mil" onclick="setMode('mil')" style="border-color:#111;color:#111">⬤ Milestone</button>
  <button class="mode-btn" id="btn-clr" onclick="setMode('clr')" style="border-color:#aaa;color:#aaa">✕ Clear</button>
  <div class="sep"></div>
  <div class="legend">
    <div class="leg"><div class="leg-box" style="background:#27ae60"></div><span id="leg-sus">Sustenance</span></div>
    <div class="leg"><div class="leg-box" style="background:#e67e22"></div><span id="leg-tar">Targeted</span></div>
    <div class="leg"><div class="leg-box" style="background:#e74c3c"></div><span id="leg-dir">Direct</span></div>
    <div class="leg"><div class="leg-dot"></div>Milestone</div>
    <div class="leg"><div class="leg-box" style="background:#f0f2f5;border:1px solid #ddd"></div>Inactive</div>
  </div>
</div>

<div class="wrap">
  <div class="gantt">
    <div id="hdr-month" class="hdr-month"></div>
    <div id="hdr-days" class="hdr-days"></div>
    <div id="body"></div>
  </div>
</div>

<div class="statsbar">
  <div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">Total Active</div></div>
  <div class="stat"><div class="stat-n g" id="s-sus">0</div><div class="stat-l editable" id="sl-sus" title="Click to rename">Sustenance</div></div>
  <div class="stat"><div class="stat-n o" id="s-tar">0</div><div class="stat-l editable" id="sl-tar" title="Click to rename">Targeted</div></div>
  <div class="stat"><div class="stat-n r" id="s-dir">0</div><div class="stat-l editable" id="sl-dir" title="Click to rename">Direct</div></div>
  <div class="stat"><div class="stat-n" id="s-mil">0</div><div class="stat-l">Milestones</div></div>
  <div class="stat"><div class="stat-n" id="s-top" style="font-size:12px">—</div><div class="stat-l">Most Active</div></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modal-title">Rename Agent</h2>
    <label>Name</label>
    <input id="modal-input" type="text" placeholder="Enter name...">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<script>
const DAYS=31,TODAY=13,START_DOW=4;
const DAY_NAMES=['Su','Mo','Tu','We','Th','Fr','Sa'];

let agentNames=["Isla","Jeff Besitos","Toronto Founder","Apolitical Man","Sports Channel","Investigative J.","Sports Fan","D2 Baller","Frat Bro","Grandmother","LVF Fan Account","Agent 12","Agent 13"];
let modeLabels={sus:'Sustenance',tar:'Targeted',dir:'Direct'};
const S={};
agentNames.forEach((_,ai)=>{S[ai]={};for(let d=1;d<=DAYS;d++)S[ai][d]={color:0,mil:false};});
let mode='sus';

// ── Encode / Decode state to URL hash ──
function encodeState(){
  const data={
    n:agentNames,
    m:modeLabels,
    c:{}
  };
  agentNames.forEach((_,ai)=>{
    const row=[];
    for(let d=1;d<=DAYS;d++){
      const {color,mil}=S[ai][d];
      row.push(color+(mil?4:0));
    }
    data.c[ai]=row;
  });
  return btoa(encodeURIComponent(JSON.stringify(data)));
}

function decodeState(hash){
  try{
    const data=JSON.parse(decodeURIComponent(atob(hash)));
    if(data.n) agentNames=data.n;
    if(data.m) Object.assign(modeLabels,data.m);
    if(data.c){
      agentNames.forEach((_,ai)=>{
        if(data.c[ai]) data.c[ai].forEach((v,i)=>{
          const d=i+1;
          S[ai][d]={color:v>=4?v-4:v,mil:v>=4};
        });
      });
    }
  }catch(e){console.warn('Could not decode state',e);}
}

function copyLink(){
  const hash=encodeState();
  const url=location.href.split('#')[0]+'#'+hash;
  navigator.clipboard.writeText(url).then(()=>{
    const btn=document.getElementById('copy-btn');
    btn.textContent='✅ Link copied!';
    btn.classList.add('copied');
    setTimeout(()=>{btn.innerHTML='🔗 Copy shareable link';btn.classList.remove('copied');},2500);
  });
  history.replaceState(null,'',location.href.split('#')[0]+'#'+hash);
}

// Load from hash on start
if(location.hash && location.hash.length>1) decodeState(location.hash.slice(1));

function isWknd(d){const dw=(START_DOW+d-1)%7;return dw===0||dw===6;}
function dayName(d){return DAY_NAMES[(START_DOW+d-1)%7];}

function setMode(m){
  mode=m;
  ['sus','tar','dir','mil','clr'].forEach(x=>{
    const b=document.getElementById('btn-'+x);
    if(b)b.classList.toggle('active',mode===x);
  });
}

function buildHeader(){
  document.getElementById('hdr-month').innerHTML=
    `<div class="hdr-agent-cell">Agent</div><div class="hdr-month-label">May 2026</div>`;
  let h=`<div class="hdr-agent-cell" style="visibility:hidden">·</div>`;
  for(let d=1;d<=DAYS;d++){
    const wk=isWknd(d),tod=d===TODAY;
    h+=`<div class="hdr-day${wk?' wknd':''}${tod?' tod':''}"><div class="dn">${dayName(d)}</div><div class="dd">${d}</div></div>`;
  }
  document.getElementById('hdr-days').innerHTML=h;
}

function buildBody(){
  const b=document.getElementById('body');
  let h='';
  agentNames.forEach((name,ai)=>{
    h+=`<div class="agent-row${ai%2?' alt':''}">
      <div class="agent-name">
        <div class="agent-num">${ai+1}</div>
        <span class="name-text" id="nt-${ai}" onclick="startRename(${ai})" title="Click to rename">${name}</span>
      </div><div class="cells">`;
    for(let d=1;d<=DAYS;d++){
      const wk=isWknd(d),tod=d===TODAY;
      h+=`<div class="cell${wk?' wknd':' blank'}${tod?' tod-col':''}" id="c-${ai}-${d}" data-ai="${ai}" data-d="${d}"></div>`;
    }
    h+=`</div></div>`;
  });
  b.innerHTML=h;
  agentNames.forEach((_,ai)=>{for(let d=1;d<=DAYS;d++)renderCell(ai,d);});
  b.querySelectorAll('.cell').forEach(c=>{
    c.addEventListener('click',()=>cellClick(+c.dataset.ai,+c.dataset.d));
  });
}

function cellClick(ai,d){
  const cell=S[ai][d];
  if(mode==='sus') cell.color=cell.color===1?0:1;
  else if(mode==='tar') cell.color=cell.color===2?0:2;
  else if(mode==='dir') cell.color=cell.color===3?0:3;
  else if(mode==='mil') cell.mil=!cell.mil;
  else if(mode==='clr'){cell.color=0;cell.mil=false;}
  renderCell(ai,d);
  updateStats();
}

function renderCell(ai,d){
  const el=document.getElementById(`c-${ai}-${d}`);
  if(!el)return;
  const {color,mil}=S[ai][d];
  const wk=isWknd(d),tod=d===TODAY;
  let cls='cell';
  if(color===1)cls+=' sustenance';
  else if(color===2)cls+=' targeted';
  else if(color===3)cls+=' direct';
  else cls+=wk?' wknd':' blank';
  if(tod)cls+=' tod-col';
  el.className=cls;
  el.innerHTML=mil?'<div class="mil-dot"></div>':'';
}

let renameIdx=-1;
function startRename(ai){
  renameIdx=ai;
  document.getElementById('modal-title').textContent=`Rename Agent ${ai+1}`;
  document.getElementById('modal-input').value=agentNames[ai];
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('modal-input').focus(),50);
}
function closeModal(){document.getElementById('modal').classList.remove('open');renameIdx=-1;}
function saveModal(){
  if(renameIdx>=0){
    const val=document.getElementById('modal-input').value.trim();
    if(val){agentNames[renameIdx]=val;document.getElementById(`nt-${renameIdx}`).textContent=val;}
  }
  closeModal();
  updateStats();
}
document.getElementById('modal-input').addEventListener('keydown',e=>{if(e.key==='Enter')saveModal();if(e.key==='Escape')closeModal();});

function editStatLabel(key){
  const el=document.getElementById('sl-'+key);
  const cur=modeLabels[key];
  el.innerHTML=`<input class="stat-input" id="si-${key}" value="${cur}">`;
  const inp=document.getElementById('si-'+key);
  inp.focus();inp.select();
  const done=()=>saveStatLabel(key,cur);
  inp.addEventListener('blur',done);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')done();});
}
function saveStatLabel(key,fallback){
  const inp=document.getElementById('si-'+key);
  if(!inp)return;
  const val=inp.value.trim()||fallback;
  modeLabels[key]=val;
  const el=document.getElementById('sl-'+key);
  el.textContent=val;
  el.classList.add('editable');
  el.onclick=()=>editStatLabel(key);
  document.getElementById('lbl-'+key).textContent=val;
  document.getElementById('leg-'+key).textContent=val;
}

function updateStats(){
  let sus=0,tar=0,dir=0,mil=0;
  const counts=new Array(agentNames.length).fill(0);
  agentNames.forEach((_,ai)=>{
    for(let d=1;d<=DAYS;d++){
      const {color,mil:m}=S[ai][d];
      if(color===1){sus++;counts[ai]++;}
      else if(color===2){tar++;counts[ai]++;}
      else if(color===3){dir++;counts[ai]++;}
      if(m)mil++;
    }
  });
  document.getElementById('s-total').textContent=sus+tar+dir;
  document.getElementById('s-sus').textContent=sus;
  document.getElementById('s-tar').textContent=tar;
  document.getElementById('s-dir').textContent=dir;
  document.getElementById('s-mil').textContent=mil;
  const mx=Math.max(...counts);
  const ti=mx>0?counts.indexOf(mx):-1;
  document.getElementById('s-top').textContent=ti>=0?`#${ti+1} ${agentNames[ti]}`:'—';
}

buildHeader();
buildBody();
updateStats();
['sus','tar','dir'].forEach(k=>{
  const el=document.getElementById('sl-'+k);
  if(el){el.classList.add('editable');el.onclick=()=>editStatLabel(k);}
});
</script>
</body>
</html>
